[project]
name = "renovator-backend"
version = "0.1.0"
description = "Local backend for the AI Agentic Home Renovator (Deep Agents on top of the deterministic renovation-planner engine)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "deepagents>=0.1",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain>=0.3",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ: this is a local, single-timezone, calendar-day app (dates, not
# instants) — naive `datetime.date.today()` is intentional throughout, not
# an oversight.
ignore = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renovator"]
