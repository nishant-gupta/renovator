<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovation Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#E7EBE4;
    --surface:#FFFFFF;
    --surface-2:#F3F6F0;
    --surface-3:#ECF0E8;
    --ink:#1C2723;
    --ink-soft:#5C665E;
    --ink-faint:#8A938B;
    --line:#D6DCD1;
    --line-strong:#BCC5B7;
    --brand:#0F5C63;
    --brand-2:#0C4A50;
    --brand-tint:#E0EDEE;
    --action:#C77A0F;
    --action-2:#AC680B;
    --action-tint:#FAECD6;
    --danger:#B23A2E;
    --danger-tint:#F5E2DF;
    --ok:#3C7A46;
    --ok-tint:#E3EFE2;
    /* trade palette — meaningful, used across schedule + materials */
    --t-mason:#8A6D3B;    --t-mason-t:#EFE7D6;
    --t-plumber:#2F6DB0;  --t-plumber-t:#DEE9F5;
    --t-electric:#B8890F; --t-electric-t:#F5EBCE;
    --t-tiling:#4E8A6E;   --t-tiling-t:#DEECE4;
    --t-painter:#8E5CA6;  --t-painter-t:#EBE0F1;
    --t-carpenter:#A85D22;--t-carpenter-t:#F3E3D4;
    --t-glass:#2E9AA1;    --t-glass-t:#D8EEEF;
    --t-material:#6B7280; --t-material-t:#E7E9EC;
    --t-other:#556;       --t-other-t:#E5E7EA;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono','Roboto Mono',Consolas,monospace;
    --shadow:0 1px 2px rgba(28,39,35,.06),0 2px 8px rgba(28,39,35,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}
  body{-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}

  /* ---------- Rail ---------- */
  .rail{
    width:210px;flex:0 0 210px;background:var(--brand);color:#DCEBEC;
    display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:0 6px 2px;}
  .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--action);position:relative;flex:0 0 26px;}
  .brand .mark::before{content:"";position:absolute;inset:6px 6px auto 6px;height:3px;background:#2A1B02;border-radius:2px;box-shadow:0 5px 0 #2A1B02,0 10px 0 #2A1B02;}
  .brand .name{font-size:15px;font-weight:700;color:#fff;line-height:1.15;letter-spacing:-.01em;}
  .brand .name span{display:block;font-size:11px;font-weight:500;color:#9FC4C6;}
  .rail-nav{margin-top:18px;display:flex;flex-direction:column;gap:1px;}
  .navbtn{all:unset;cursor:pointer;padding:9px 11px;border-radius:6px;font-size:13.5px;color:#BFD8D9;display:flex;align-items:center;gap:10px;}
  .navbtn .ic{width:16px;text-align:center;font-size:14px;opacity:.9;}
  .navbtn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .navbtn.active{background:#fff;color:var(--brand-2);font-weight:600;}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;}
  .rail-foot .startbox{background:rgba(255,255,255,.08);border-radius:6px;padding:8px 10px;}
  .rail-foot .startbox label{display:block;font-size:10.5px;color:#9FC4C6;margin-bottom:4px;}
  .rail-foot .startbox input{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.95);border-radius:4px;padding:5px 6px;font-family:var(--mono);font-size:12px;color:var(--ink);}
  .railact{all:unset;cursor:pointer;text-align:left;padding:8px 11px;border-radius:6px;font-size:12.5px;color:#CFE3E4;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
  .railact:hover{background:rgba(255,255,255,.14);color:#fff;}
  .railact.primary{background:var(--action);color:#2A1B02;font-weight:700;}
  .railact.primary:hover{background:var(--action-2);}
  .savenote{font-size:10.5px;color:#8FB6B8;padding:2px 4px;font-family:var(--mono);}

  main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1300px;}
  .page-h{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px;}
  .page-sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;max-width:680px;line-height:1.5;}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .spacer{flex:1;}

  /* ---------- Chips / tags ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--ink);}
  .chip:hover{border-color:var(--brand);}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .chip.ghost{border-style:dashed;color:var(--ink-soft);}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface);}
  .seg button{all:unset;cursor:pointer;padding:7px 14px;font-size:12.5px;color:var(--ink-soft);}
  .seg button.active{background:var(--brand);color:#fff;font-weight:600;}
  .seg button+button{border-left:1px solid var(--line);}

  .tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;}
  .tag-material{background:var(--t-material-t);color:#4b5563;}
  .tag-labor{background:var(--brand-tint);color:var(--brand-2);}
  .tag-inclusive{background:var(--ok-tint);color:var(--ok);}
  .tag-mand{background:var(--danger-tint);color:var(--danger);}
  .tag-opt{background:var(--surface-3);color:var(--ink-soft);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:11px;background:var(--surface-3);color:var(--ink-soft);}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:0 0 8px;}

  /* ---------- Buttons ---------- */
  .btn{all:unset;cursor:pointer;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:600;background:var(--action);color:#2A1B02;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{background:var(--action-2);}
  .btn-brand{background:var(--brand);color:#fff;}
  .btn-brand:hover{background:var(--brand-2);}
  .btn-ghost{all:unset;cursor:pointer;padding:8px 14px;border-radius:7px;font-size:13px;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface);display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--brand);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-danger{all:unset;cursor:pointer;padding:5px 10px;border-radius:6px;font-size:12px;color:var(--danger);}
  .btn-danger:hover{background:var(--danger-tint);}
  .iconbtn{all:unset;cursor:pointer;padding:4px 7px;border-radius:5px;font-size:13px;color:var(--ink-soft);}
  .iconbtn:hover{background:var(--surface-3);color:var(--ink);}

  /* ---------- Cards / stats ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);}
  .statrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;min-width:140px;flex:1;box-shadow:var(--shadow);}
  .stat .k{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
  .stat .v{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .stat .v.sm{font-size:19px;}
  .stat .note{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  .sect{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin:24px 0 10px;display:flex;align-items:center;gap:8px;}
  .sect::after{content:"";flex:1;height:1px;background:var(--line);}
  .sect:first-child{margin-top:0;}

  /* ---------- Tables ---------- */
  table.dt{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
  table.dt th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);}
  table.dt td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt tbody tr:hover{background:var(--surface-2);}
  .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  .grp td{background:var(--brand-tint);font-weight:700;color:var(--brand-2);font-size:12px;padding:7px 12px;}
  tr.sel td{background:var(--action-tint);}

  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--ink);width:100%;
  }
  input[type=number]{font-family:var(--mono);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand);}
  .fl{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field{margin-bottom:12px;}
  .frow{display:flex;gap:12px;}
  .frow .field{flex:1;}
  .radios{display:flex;gap:14px;font-size:13px;align-items:center;flex-wrap:wrap;}
  .radios label{display:flex;align-items:center;gap:5px;cursor:pointer;}

  /* ---------- Bars ---------- */
  .bar-row{display:grid;grid-template-columns:200px 1fr 96px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:7px;}
  .bar-track{background:var(--surface-3);border-radius:4px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-val{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}

  /* ---------- Board (drag/drop) ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;}
  .col{flex:0 0 258px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;}
  .col.drop{outline:2px dashed var(--brand);outline-offset:-4px;}
  .col h3{font-size:12.5px;margin:0;color:var(--brand-2);font-weight:700;}
  .col .ctot{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin:2px 0 9px;}
  .tcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--t-other);border-radius:7px;padding:8px 10px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03);}
  .tcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow);}
  .tcard .tn{font-size:12.5px;font-weight:600;margin-bottom:2px;}
  .tcard .tr{font-size:11px;color:var(--ink-soft);}
  .tcard .tc{font-family:var(--mono);font-size:11.5px;margin-top:3px;}
  .tcard .tdep{margin-top:5px;font-size:10px;color:var(--danger);background:var(--danger-tint);padding:2px 6px;border-radius:4px;}
  .tcard[draggable=true]:active{cursor:grabbing;}

  /* ---------- Gantt ---------- */
  .gantt-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--surface);box-shadow:var(--shadow);max-height:70vh;}
  .gantt{position:relative;font-size:11px;}
  .g-head{display:flex;position:sticky;top:0;z-index:5;background:var(--surface-2);border-bottom:1px solid var(--line-strong);}
  .g-lbl-col{flex:0 0 210px;position:sticky;left:0;z-index:6;background:var(--surface-2);border-right:1px solid var(--line-strong);padding:6px 10px;font-weight:700;color:var(--ink-soft);}
  .g-months{display:flex;}
  .g-month{border-right:1px solid var(--line-strong);padding:3px 8px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .g-days{display:flex;}
  .g-day{flex:0 0 auto;text-align:center;border-right:1px solid var(--line);color:var(--ink-faint);padding:2px 0;font-family:var(--mono);}
  .g-day.we{background:var(--surface-3);}
  .g-day.today{background:var(--action-tint);color:var(--action-2);font-weight:700;}
  .g-body{position:relative;}
  .g-stagehdr{display:flex;background:var(--brand-tint);border-bottom:1px solid var(--line);}
  .g-stagehdr .g-lbl-col{background:var(--brand-tint);color:var(--brand-2);font-weight:700;}
  .g-stagehdr .g-grid{flex:1;}
  .g-taskrow{display:flex;border-bottom:1px solid var(--line);min-height:30px;}
  .g-taskrow:hover .g-lbl-col{background:var(--surface-2);}
  .g-tasklbl{flex:0 0 210px;position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line-strong);padding:5px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;overflow:hidden;}
  .g-tasklbl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;}
  .g-tasklbl .rm{color:var(--ink-faint);font-size:10.5px;}
  .g-lane{position:relative;flex:1;}
  .g-weekend{position:absolute;top:0;bottom:0;background:var(--surface-3);opacity:.6;}
  .g-todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--action);z-index:3;}
  .g-bar{position:absolute;top:5px;height:20px;border-radius:5px;display:flex;align-items:center;padding:0 7px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .g-bar:hover{filter:brightness(1.06);box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .g-bar .barlbl{overflow:hidden;text-overflow:ellipsis;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin:10px 0 4px;}
  .legend .li{display:inline-flex;align-items:center;gap:5px;}

  /* ---------- Agenda ---------- */
  .agwk{margin-bottom:14px;}
  .agwk-h{font-size:12px;font-weight:700;color:var(--brand-2);background:var(--brand-tint);padding:6px 12px;border-radius:7px 7px 0 0;border:1px solid var(--line);}
  .agday{display:flex;gap:12px;border:1px solid var(--line);border-top:none;padding:9px 12px;background:var(--surface);}
  .agday:last-child{border-radius:0 0 7px 7px;}
  .agday .d{flex:0 0 84px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .agday .d .wd{color:var(--ink-faint);font-size:10.5px;}
  .agday.we .d{color:var(--ink-faint);}
  .agday .body{flex:1;min-width:0;}
  .agtask{font-size:12.5px;padding:2px 0;display:flex;align-items:center;gap:7px;}
  .agtask .start{font-size:9.5px;font-weight:700;color:var(--ok);background:var(--ok-tint);padding:1px 5px;border-radius:3px;}
  .agtask .cont{font-size:9.5px;color:var(--ink-faint);}
  .agtrades{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}

  .empty{color:var(--ink-soft);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,26,22,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:26px 16px;animation:fade .12s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;width:620px;max-width:100%;border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 52px);box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 12px;border-bottom:1px solid var(--line);}
  .modal-h h2{font-size:17px;margin:0;font-weight:700;}
  .modal-b{padding:16px 22px 6px;overflow-y:auto;}
  .modal-f{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--line);background:#fff;border-radius:0 0 12px 12px;}
  .modal .field{margin-bottom:10px;}
  .modal .sect{margin:14px 0 8px;}
  .preview{font-family:var(--mono);font-size:15px;color:var(--brand);font-weight:700;}
  .deplist{max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface-2);}
  .deplist label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;cursor:pointer;}
  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .tpl{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;cursor:pointer;background:var(--surface);font-size:12.5px;}
  .tpl:hover{border-color:var(--brand);background:var(--surface-2);}
  .tpl b{display:block;font-size:12.5px;}
  .tpl span{font-size:10.5px;color:var(--ink-soft);}

  .orderlist{list-style:none;margin:0;padding:0;counter-reset:s;}
  .orderlist li{counter-increment:s;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:10px;align-items:center;}
  .orderlist li::before{content:counter(s);font-family:var(--mono);color:var(--ink-faint);width:22px;flex:0 0 22px;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .rail{width:100%;flex-direction:row;height:auto;position:relative;align-items:center;padding:10px 12px;overflow-x:auto;gap:8px;}
    .brand{padding:0;}.brand .name span{display:none;}
    .rail-nav{margin-top:0;flex-direction:row;}
    .rail-foot{margin-top:0;margin-left:auto;flex-direction:row;align-items:center;padding-top:0;}
    .rail-foot .startbox{display:none;}
    .savenote{display:none;}
    main{padding:18px;}
    .frow{flex-direction:column;gap:0;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">
      <div class="mark"></div>
      <div class="name">Renovation<span>self-planner</span></div>
    </div>
    <div class="rail-nav" id="railNav"></div>
    <div class="rail-foot">
      <div class="startbox">
        <label for="projStart">Project start date</label>
        <input type="date" id="projStart" onchange="setProjectStart(this.value)">
      </div>
      <button class="railact primary" onclick="exportXLSX()">↧ Export Excel</button>
      <button class="railact" onclick="document.getElementById('impFile').click()">↥ Import Excel</button>
      <input type="file" id="impFile" accept=".xlsx,.xls" style="display:none;" onchange="handleImportFile(this.files[0]); this.value='';">
      <button class="railact" onclick="if(confirm('Reset everything back to the starting example plan? This cannot be undone.')) resetToSeed()">↺ Reset to example</button>
      <div class="savenote" id="saveNote">Loading…</div>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
/* ============================================================================
   RENOVATION SELF-PLANNER
   Tabs: Setup · Tasks · Schedule · Materials · Estimate · Track
   A "task" = one line, or a linked Material+Labor pair sharing room/name/category.
   ========================================================================== */

const TABS = [
  {id:'setup',    label:'Setup',    ic:'⚙'},
  {id:'tasks',    label:'Tasks',    ic:'▤'},
  {id:'schedule', label:'Schedule', ic:'▦'},
  {id:'materials',label:'Materials',ic:'▩'},
  {id:'estimate', label:'Estimate', ic:'₹'},
  {id:'track',    label:'Track',    ic:'◉'},
];

const CATEGORIES = ['Carpentry','Furnishing','Plumbing','Electrical','Tiling','Civil','Civil/POP','Flooring','Painting','Civil/Carpentry','Plumbing/Glasswork','Other'];
const LINE_TYPES = ['Material','Labor','Inclusive'];
const STATUSES = ['Not Started','In Progress','Done','On Hold'];
const BUY_STATUSES = ['To buy','Ordered','Delivered'];
const UNITS = ['sqft','running ft','point','fixture','lumpsum'];

// Category -> default trade for Labor / Inclusive lines. Material is always "Material".
const CATEGORY_TRADE = {
  'Carpentry':{labor:'Carpenter',inclusive:'Carpenter'},
  'Furnishing':{labor:'Carpenter/Vendor',inclusive:'Carpenter/Vendor'},
  'Plumbing':{labor:'Plumber',inclusive:'Plumber'},
  'Electrical':{labor:'Electrician',inclusive:'Electrician'},
  'Tiling':{labor:'Tile Installer',inclusive:'Tile Installer'},
  'Civil':{labor:'Mason',inclusive:'Mason'},
  'Civil/POP':{labor:'Mason / POP',inclusive:'Mason / POP'},
  'Flooring':{labor:'Flooring Contractor',inclusive:'Flooring Contractor'},
  'Painting':{labor:'Painter',inclusive:'Painter'},
  'Civil/Carpentry':{labor:'Mason / Carpenter',inclusive:'Mason / Carpenter'},
  'Plumbing/Glasswork':{labor:'Glass Fabricator',inclusive:'Glass Fabricator'},
  'Other':{labor:'',inclusive:''},
};
// Category -> default duration in working days (a starting guess, editable per task).
const CATEGORY_DURATION = {
  'Carpentry':4,'Furnishing':1,'Plumbing':2,'Electrical':2,'Tiling':3,'Civil':3,
  'Civil/POP':3,'Flooring':3,'Painting':2,'Civil/Carpentry':2,'Plumbing/Glasswork':2,'Other':1,
};
function tradeFor(cat, lt){
  if(lt==='Material') return 'Material';
  const m = CATEGORY_TRADE[cat]; if(!m) return '';
  return lt==='Labor' ? m.labor : m.inclusive;

/* ============================== STATE / PERSISTENCE ============================== */
let state=null, loaded=false, draftTask=null, draftIsNew=false, saveTimer=null;
const STORAGE_KEY='reno_self_planner_v2';

function hasClaudeStorage(){ return typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'&&typeof window.storage.set==='function'; }
function hasLocalStorage(){ try{const k='__reno_probe__';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true;}catch(e){return false;} }

async function loadState(){
  let raw=null;
  if(hasClaudeStorage()){ try{ const res=await window.storage.get(STORAGE_KEY,false); if(res&&res.value) raw=res.value; }catch(e){} }
  if(!raw&&hasLocalStorage()){ try{ const v=window.localStorage.getItem(STORAGE_KEY); if(v) raw=v; }catch(e){} }
  if(raw){
    try{
      state=JSON.parse(raw);
      normalizeState();
    }catch(e){ state=seedState(); }
  } else { state=seedState(); }
  loaded=true;
  renderAll();
}
function normalizeState(){
  if(!state.rooms) state.rooms=defaultRooms();
  if(!state.rates) state.rates=defaultRates();
  if(!state.phases) state.phases=defaultPhases();
  if(!state.stages) state.stages=defaultStages();
  if(!state.items) state.items=[];
  if(!state.projectStart) state.projectStart=defaultProjectStart();
  if(state.workWeekends==null) state.workWeekends=false;
  if(state.sequenceStages==null) state.sequenceStages=true;
  migrateStagePhaseModel(state);
  migrateBatchToStage(state.items);
  state.items.forEach(it=>{
    if(it.durationDays==null) it.durationDays = CATEGORY_DURATION[it.category]||1;
    if(it.buyStatus==null) it.buyStatus='To buy';
    if(it.startOverride===undefined) it.startOverride=null;
  });
  deriveTaskIds(state.items);
  if(!state.activeTab) state.activeTab='tasks';
  if(!state.planRoomFilter) state.planRoomFilter='All';
  if(!state.phaseFilter) state.phaseFilter='All';
  if(!state.scheduleView) state.scheduleView='timeline';
  if(state.searchQuery==null) state.searchQuery='';
}

function persist(){
  const note=document.getElementById('saveNote'); if(note) note.textContent='Saving…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const json=JSON.stringify(state); let c=false,l=false;
    if(hasClaudeStorage()){ try{await window.storage.set(STORAGE_KEY,json,false);c=true;}catch(e){} }
    if(!c&&hasLocalStorage()){ try{window.localStorage.setItem(STORAGE_KEY,json);l=true;}catch(e){} }
    if(!note) return;
    const t=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    note.textContent = c?('Saved '+t) : l?('Saved in browser '+t) : 'Use Export to keep your work';
  },400);
  schedCache=null; // any change may affect dates
}
function resetToSeed(){ state=seedState(); schedCache=null; persist(); renderAll(); }
function setProjectStart(v){ if(!v) return; state.projectStart=v; schedCache=null; persist(); renderMain(); }

/* ============================== HELPERS ============================== */
function fmt(n){ n=Math.round(Number(n)||0); return '₹'+n.toLocaleString('en-IN'); }
function getRate(k){ return state.rates.find(r=>r.key===k); }
function getItem(id){ return state.items.find(i=>i.id===id); }
function itemCost(it){ if(it.costMethod==='rate'){ const r=getRate(it.rateKey); return (r?r.value:0)*(Number(it.qty)||0);} return Number(it.customAmount)||0; }
function grandTotal(items){ return items.reduce((s,i)=>s+itemCost(i),0); }
function uid(p){ return (p||'item')+'_'+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* dates: work on local Date at noon to dodge tz/DST edges. Store ISO yyyy-mm-dd. */
function isoDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; }
function parseDate(s){ if(!s) return null; const p=String(s).split('-'); if(p.length<3) return null; const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); d.setHours(12,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); x.setHours(12,0,0,0); return x; }
function isWeekend(d){ const g=d.getDay(); return g===0||g===6; }
function nextWorkday(d){ let x=new Date(d); if(state.workWeekends) return x; while(isWeekend(x)) x=addDays(x,1); return x; }
// end date after `dur` working days starting at `start`
function addWorkingDays(start, dur){
  let x=nextWorkday(new Date(start)); let count=1;
  while(count<dur){ x=addDays(x,1); if(!state.workWeekends){ while(isWeekend(x)) x=addDays(x,1);} count++; }
  return x;
}
function fmtDay(d){ return d.getDate()+' '+d.toLocaleString('en-US',{month:'short'}); }
function weekdayShort(d){ return d.toLocaleString('en-US',{weekday:'short'}); }
function isoWeekKey(d){ const x=addDays(d, -( (d.getDay()+6)%7 )); return isoDate(x); } // Monday of that week
function daysDiff(a,b){ return Math.round((b-a)/86400000); }

function tagLineType(lt){ const c=lt==='Material'?'tag-material':lt==='Labor'?'tag-labor':'tag-inclusive'; return `<span class="tag ${c}">${lt}</span>`; }
function tagMand(m){ return m?`<span class="tag tag-mand">Mandatory</span>`:`<span class="tag tag-opt">Optional</span>`; }

/* dependency cycle guard */
function wouldCreateCycle(itemId,newDeps,override){
  const items=override||state.items; const map={};
  items.forEach(it=>map[it.id]=(it.id===itemId?newDeps:(it.dependsOn||[])));
  function reach(s,t,seen){ seen=seen||new Set(); if(s===t) return true; if(seen.has(s)) return false; seen.add(s); for(const d of (map[s]||[])){ if(reach(d,t,seen)) return true;} return false; }
  for(const d of newDeps){ if(reach(d,itemId)) return true; } return false;
}
function suggestedOrder(){
  const visited=new Set(),temp=new Set(),order=[];
  function visit(id){ if(visited.has(id)||temp.has(id)) return; temp.add(id); const it=getItem(id); (it&&it.dependsOn||[]).forEach(d=>{if(getItem(d))visit(d);}); temp.delete(id); visited.add(id); order.push(id); }
  [...state.items].sort((a,b)=>stageOrder(a.stageId)-stageOrder(b.stageId)).map(i=>i.id).forEach(visit);
  return order.map(id=>getItem(id)).filter(Boolean);
}

/* migrations from older saved shapes */
function migrateStagePhaseModel(state){
  const old = Array.isArray(state.stages)&&state.stages.length>0&&state.stages[0].phaseId!==undefined;
  if(!old) return;
  state.stages=state.stages.map(s=>({id:s.id,label:s.label}));
  state.phases=defaultPhases();
  (state.items||[]).forEach(it=>{ it.phase = it.mandatory===false?2:1; });
}
function migrateBatchToStage(items){
  items.forEach(it=>{
    if(it.stageId!=null) return;
    const label=(it.batch||'').trim(); if(!label) return;
    let st=state.stages.find(s=>s.label===label);
    if(!st){ st={id:nextStageId(),label}; state.stages.push(st); }
    it.stageId=st.id;
  });
}

/* task grouping */
function deriveTaskIds(items){
  const groups={};
  items.forEach(it=>{ if(it.taskId) return; const k=it.room+'|'+it.name+'|'+it.category; (groups[k]=groups[k]||[]).push(it); });
  Object.values(groups).forEach(g=>{
    if(g.length===2){ const t=g.map(x=>x.lineType).sort().join(','); if(t==='Labor,Material'){ const tid=uid('task'); g.forEach(x=>x.taskId=tid); return; } }
    g.forEach(x=>{ if(!x.taskId) x.taskId=x.id; });
  });
  return items;
}
function groupByTask(items){
  const map={},order=[];
  items.forEach(it=>{ const tid=it.taskId||it.id; if(!map[tid]){map[tid]=[];order.push(tid);} map[tid].push(it); });
  return order.map(tid=>{
    const lines=map[tid]; const mat=lines.find(l=>l.lineType==='Material'); const lab=lines.find(l=>l.lineType==='Labor');
    const isSplit=lines.length===2&&!!mat&&!!lab; const primary=lab||lines[0];
    return {taskId:tid,room:primary.room,name:primary.name,category:primary.category,phase:primary.phase,stageId:primary.stageId,
      mandatory:primary.mandatory,durationDays:primary.durationDays,startOverride:primary.startOverride,
      lines,isSplit,material:mat,labor:lab,primary,totalCost:lines.reduce((s,l)=>s+itemCost(l),0)};
  });
}
function taskTradeBucket(task){ const w = task.isSplit?(task.labor.workerType):(task.primary.workerType); return tradeBucket(w||task.category); }

/* ============================== SCHEDULE ENGINE ============================== */
/* Forward-pass earliest-start honouring: project start, optional stage cascade,
   dependency finishes, and per-task manual start overrides. Returns map taskId -> {start,end}. */
let schedCache=null;
function computeSchedule(){
  if(schedCache) return schedCache;
  const start = parseDate(state.projectStart) || parseDate(defaultProjectStart());
  const tasks = groupByTask(state.items);
  const byId={}; tasks.forEach(t=>byId[t.taskId]=t);

  // map every line id -> its taskId, so dependencies (stored per line) resolve to tasks
  const lineToTask={}; state.items.forEach(i=>lineToTask[i.id]=i.taskId||i.id);
  function taskDeps(t){ const s=new Set(); t.lines.forEach(l=>(l.dependsOn||[]).forEach(d=>{ const tid=lineToTask[d]; if(tid&&tid!==t.taskId) s.add(tid); })); return [...s]; }

  // stage cascade baseline: earliest a stage may begin = latest finish of all earlier-stage tasks
  const sched={};
  // process in dependency + stage order
  const ordered=[];
  const visited=new Set(),temp=new Set();
  const orderIndex={}; tasks.forEach((t,i)=>orderIndex[t.taskId]=i);
  function visit(tid){ if(visited.has(tid)||temp.has(tid)) return; temp.add(tid); const t=byId[tid]; if(t) taskDeps(t).forEach(d=>{ if(byId[d]) visit(d); }); temp.delete(tid); visited.add(tid); ordered.push(tid); }
  [...tasks].sort((a,b)=>stageOrder(a.stageId)-stageOrder(b.stageId)|| (orderIndex[a.taskId]-orderIndex[b.taskId])).forEach(t=>visit(t.taskId));

  function stageCascadeStart(t){
    if(!state.sequenceStages) return start;
    const so = stageOrder(t.stageId);
    let latest=null;
    for(const tid in sched){ const ot=byId[tid]; if(!ot) continue; if(stageOrder(ot.stageId)<so){ const e=sched[tid].end; if(!latest||e>latest) latest=e; } }
    return latest ? nextWorkday(addDays(latest,1)) : start;
  }

  ordered.forEach(tid=>{
    const t=byId[tid]; if(!t) return;
    let s = nextWorkday(new Date(start));
    const cascade = stageCascadeStart(t); if(cascade>s) s=cascade;
    taskDeps(t).forEach(d=>{ if(sched[d]){ const after=nextWorkday(addDays(sched[d].end,1)); if(after>s) s=after; } });
    if(t.startOverride){ const ov=parseDate(t.startOverride); if(ov) s=nextWorkday(ov); }
    const dur=Math.max(1,Number(t.durationDays)||1);
    const e=addWorkingDays(s,dur);
    sched[tid]={start:s,end:e,dur};
  });

  schedCache={map:sched,byId,tasks,projStart:start};
  return schedCache;
}
function projectEndDate(){ const {map}=computeSchedule(); let mx=null; for(const k in map){ if(!mx||map[k].end>mx) mx=map[k].end; } return mx; }

/* ---- Timeline / Gantt ---- */
function renderGantt(){
  const {map,byId}=computeSchedule();
  const q=state.searchQuery||'';
  let tasks=groupByTask(phaseFiltered(state.items));
  if(q) tasks=tasks.filter(t=>matchesSearch(t,q));
  const shown=tasks.filter(t=>map[t.taskId]);
  if(!shown.length) return `<div class="empty">No scheduled tasks match. Add tasks or clear the filter.</div>`;

  let minD=null,maxD=null;
  shown.forEach(t=>{ const s=map[t.taskId]; if(!minD||s.start<minD)minD=s.start; if(!maxD||s.end>maxD)maxD=s.end; });
  minD=addDays(minD,-1); maxD=addDays(maxD,2);
  const totalDays=Math.max(1,daysDiff(minD,maxD)+1);
  const CW=30;
  const today=new Date(); today.setHours(12,0,0,0);

  // header: months + days
  const days=[]; for(let i=0;i<totalDays;i++) days.push(addDays(minD,i));
  const months=[]; days.forEach((d,i)=>{ const key=d.getFullYear()+'-'+d.getMonth(); const last=months[months.length-1]; if(last&&last.key===key) last.n++; else months.push({key,n:1,label:d.toLocaleString('en-US',{month:'long',year:'numeric'})}); });
  const monthBand=months.map(m=>`<div class="g-month" style="width:${m.n*CW}px;">${m.label}</div>`).join('');
  const dayBand=days.map(d=>`<div class="g-day ${state.workWeekends?'':(isWeekend(d)?'we':'')} ${isoDate(d)===isoDate(today)?'today':''}" style="width:${CW}px;">${d.getDate()}</div>`).join('');

  // weekend overlays + today line (drawn per lane via absolute)
  function overlays(){
    let ov='';
    if(!state.workWeekends){ days.forEach((d,i)=>{ if(isWeekend(d)) ov+=`<div class="g-weekend" style="left:${i*CW}px;width:${CW}px;"></div>`; }); }
    const ti=daysDiff(minD,today); if(ti>=0&&ti<totalDays) ov+=`<div class="g-todayline" style="left:${ti*CW+CW/2}px;"></div>`;
    return ov;
  }

  // rows grouped by stage (in stage order), then unassigned
  const stagesInOrder=[...state.stages].sort((a,b)=>stageOrder(a.id)-stageOrder(b.id));
  const groups=stagesInOrder.map(s=>({stage:s,tasks:shown.filter(t=>t.stageId===s.id)})).filter(g=>g.tasks.length);
  const un=shown.filter(t=>t.stageId==null||!state.stages.some(s=>s.id===t.stageId));
  if(un.length) groups.push({stage:{label:'Unassigned'},tasks:un});

  function barHTML(t){
    const s=map[t.taskId]; const off=daysDiff(minD,s.start); const span=daysDiff(s.start,s.end)+1;
    const col=tradeColor(taskTradeBucket(t).key);
    const lbl=`${esc(t.name)}`;
    const w=span*CW-4;
    return `<div class="g-taskrow">
      <div class="g-tasklbl" onclick="openTaskModal('${t.taskId}')" title="${esc(t.room+' — '+t.name)}">
        <span class="dot" style="background:${col}"></span><span class="nm">${esc(t.name)} <span class="rm">· ${esc(t.room)}</span></span>
      </div>
      <div class="g-lane" style="width:${totalDays*CW}px;">${overlays()}
        <div class="g-bar" style="left:${off*CW+2}px;width:${w}px;background:${col};" onclick="openTaskModal('${t.taskId}')" title="${esc(t.name)} · ${fmtDay(s.start)}–${fmtDay(s.end)} · ${s.dur}d${t.startOverride?' · fixed start':''}">
          <span class="barlbl">${lbl}</span>
        </div>
      </div></div>`;
  }
  const rows=groups.map(g=>{
    const hdr=`<div class="g-stagehdr"><div class="g-lbl-col">${esc(g.stage.label)}</div><div class="g-grid" style="width:${totalDays*CW}px;position:relative;">${overlays()}</div></div>`;
    return hdr+g.tasks.map(barHTML).join('');
  }).join('');

  return `<div class="gantt-wrap"><div class="gantt" style="min-width:${210+totalDays*CW}px;">
    <div class="g-head"><div class="g-lbl-col">Task</div><div><div class="g-months">${monthBand}</div><div class="g-days">${dayBand}</div></div></div>
    <div class="g-body">${rows}</div>
  </div></div>`;
}

/* ---- Agenda (by date) ---- */
function renderAgenda(){
  const {map}=computeSchedule();
  const q=state.searchQuery||'';
  let tasks=groupByTask(phaseFiltered(state.items));
  if(q) tasks=tasks.filter(t=>matchesSearch(t,q));
  const shown=tasks.filter(t=>map[t.taskId]);
  if(!shown.length) return `<div class="empty">No scheduled tasks match.</div>`;
  let minD=null,maxD=null; shown.forEach(t=>{const s=map[t.taskId]; if(!minD||s.start<minD)minD=s.start; if(!maxD||s.end>maxD)maxD=s.end;});

  const rowsByDate={};
  for(let d=new Date(minD); d<=maxD; d=addDays(d,1)){
    if(!state.workWeekends&&isWeekend(d)) continue;
    const key=isoDate(d);
    const starting=shown.filter(t=>isoDate(map[t.taskId].start)===key);
    const active=shown.filter(t=>{const s=map[t.taskId]; return s.start<=d&&d<=s.end;});
    if(!active.length) continue;
    rowsByDate[key]={date:new Date(d),starting,active};
  }
  const keys=Object.keys(rowsByDate).sort();
  // group by week
  const weeks={}; keys.forEach(k=>{ const wk=isoWeekKey(rowsByDate[k].date); (weeks[wk]=weeks[wk]||[]).push(k); });
  const wkKeys=Object.keys(weeks).sort();

  return wkKeys.map(wk=>{
    const first=parseDate(weeks[wk][0]); const wkEnd=addDays(parseDate(wk),6);
    const days=weeks[wk].map(k=>{
      const r=rowsByDate[k];
      const trades=[...new Set(r.active.map(t=>taskTradeBucket(t).key))];
      const tradeNames={mason:'Mason/Civil',plumber:'Plumber',electric:'Electrician',tiling:'Tiling',glass:'Glass',painter:'Painter',carpenter:'Carpenter',material:'Material',other:'Other'};
      const trHtml=trades.map(k=>`<span class="badge"><span class="dot" style="background:${tradeColor(k)}"></span>${tradeNames[k]||k}</span>`).join('');
      const list=r.active.map(t=>{
        const isStart=r.starting.includes(t);
        const s=map[t.taskId];
        return `<div class="agtask"><span class="dot" style="background:${tradeColor(taskTradeBucket(t).key)}"></span>
          <span onclick="openTaskModal('${t.taskId}')" style="cursor:pointer;">${esc(t.name)} <span style="color:var(--ink-faint);">· ${esc(t.room)}</span></span>
          ${isStart?'<span class="start">STARTS</span>':`<span class="cont">day ${daysDiff(s.start,r.date)+1}/${s.dur}</span>`}</div>`;
      }).join('');
      return `<div class="agday ${isWeekend(r.date)?'we':''}">
        <div class="d">${r.date.getDate()} ${r.date.toLocaleString('en-US',{month:'short'})}<div class="wd">${weekdayShort(r.date)}</div></div>
        <div class="body">${list}<div class="agtrades">${trHtml}</div></div></div>`;
    }).join('');
    return `<div class="agwk"><div class="agwk-h">Week of ${fmtDay(parseDate(wk))} — ${fmtDay(wkEnd)}</div>${days}</div>`;
  }).join('');
}

/* ---- Board (drag/drop stages + tasks) ---- */
let dragTaskId=null, dragStageId=null;
function renderBoard(){
  const q=state.searchQuery||'';
  let tasks=groupByTask(phaseFiltered(state.items));
  if(q) tasks=tasks.filter(t=>matchesSearch(t,q));
  function card(t){
    const deps=t.isSplit?[...new Set([...(t.material.dependsOn||[]),...(t.labor.dependsOn||[])])]:(t.lines[0].dependsOn||[]);
    const di=deps.map(d=>getItem(d)).filter(Boolean);
    const dh=di.length?`<div class="tdep">after: ${di.map(d=>esc(d.name)).join(', ')}</div>`:'';
    const col=tradeColor(taskTradeBucket(t).key);
    const ph=state.phaseFilter==='All'?`<span class="tag tag-opt" style="margin-left:4px;">${esc((getPhase(t.phase)||{}).label||'')}</span>`:'';
    return `<div class="tcard" draggable="true" style="border-left-color:${col};"
      ondragstart="onCardDragStart(event,'${t.taskId}')" ondragover="event.preventDefault();event.stopPropagation();" ondrop="onCardDrop(event,'${t.taskId}')" onclick="openTaskModal('${t.taskId}')">
      <div class="tn">${esc(t.name)}</div>
      <div class="tr">${esc(t.room)} · ${t.durationDays||1}d ${ph}</div>
      <div class="tc">${fmt(t.totalCost)}</div>${dh}</div>`;
  }
  function col(stage,ts){
    const tot=ts.reduce((s,t)=>s+t.totalCost,0);
    return `<div class="col" ondragover="event.preventDefault();this.classList.add('drop');" ondragleave="this.classList.remove('drop');" ondrop="this.classList.remove('drop');onStageDrop(event,${stage.id})">
      <div class="row between" draggable="true" ondragstart="onStageHeaderDragStart(event,${stage.id})" style="cursor:grab;">
        <h3>${esc(stage.label)}</h3><span><button class="iconbtn" onclick="event.stopPropagation();renameStage(${stage.id})">✎</button><button class="iconbtn" onclick="event.stopPropagation();removeStage(${stage.id})">✕</button></span></div>
      <div class="ctot">${ts.length} item${ts.length===1?'':'s'} · ${fmt(tot)}</div>
      ${ts.length?ts.map(card).join(''):'<div class="empty" style="padding:14px;">Drop tasks here</div>'}
      <button class="btn-ghost btn-sm" style="width:100%;margin-top:8px;" onclick="openTaskModal(null,null,${stage.id})">+ Add here</button></div>`;
  }
  const stagesInOrder=[...state.stages].sort((a,b)=>stageOrder(a.id)-stageOrder(b.id));
  const cols=stagesInOrder.map(s=>col(s,tasks.filter(t=>t.stageId===s.id)));
  const un=tasks.filter(t=>t.stageId==null||!state.stages.some(s=>s.id===t.stageId));
  const unHtml=un.length?`<div class="col" ondragover="event.preventDefault();this.classList.add('drop');" ondragleave="this.classList.remove('drop');" ondrop="this.classList.remove('drop');onStageDrop(event,null)"><h3>Unassigned</h3><div class="ctot">${un.length} item(s)</div>${un.map(card).join('')}</div>`:'';
  return `<div class="row" style="margin-bottom:10px;"><button class="btn-ghost btn-sm" onclick="addStage()">+ Add stage</button></div><div class="board">${cols.join('')}${unHtml}</div>`;
}
function onCardDragStart(e,id){ dragTaskId=id; dragStageId=null; if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id);}catch(x){}} }
function moveTaskLines(taskId,stageId){ const lines=state.items.filter(i=>i.taskId===taskId); if(!lines.length) return []; state.items=state.items.filter(i=>i.taskId!==taskId); lines.forEach(l=>l.stageId=stageId); return lines; }
function onStageDrop(e,stageId){ if(e){e.preventDefault();e.stopPropagation();} if(dragStageId!=null){onStageHeaderDrop(stageId);return;} if(!dragTaskId) return; const l=moveTaskLines(dragTaskId,stageId); if(!l.length){dragTaskId=null;return;} state.items.push(...l); dragTaskId=null; schedCache=null; persist(); renderMain(); }
function onCardDrop(e,target){ if(e){e.preventDefault();e.stopPropagation();} if(!dragTaskId||dragTaskId===target) return; const tl=state.items.filter(i=>i.taskId===target); if(!tl.length) return; const ts=tl[0].stageId; const l=moveTaskLines(dragTaskId,ts); if(!l.length){dragTaskId=null;return;} const at=state.items.findIndex(i=>i.taskId===target); state.items.splice(at<0?state.items.length:at,0,...l); dragTaskId=null; schedCache=null; persist(); renderMain(); }
function onStageHeaderDragStart(e,id){ dragStageId=id; dragTaskId=null; if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','stage:'+id);}catch(x){}} }
function onStageHeaderDrop(target){ if(dragStageId==null||dragStageId===target){dragStageId=null;return;} const f=state.stages.findIndex(s=>s.id===dragStageId), t=state.stages.findIndex(s=>s.id===target); if(f<0||t<0){dragStageId=null;return;} const [m]=state.stages.splice(f,1); state.stages.splice(t,0,m); dragStageId=null; schedCache=null; persist(); renderMain(); }

function addStage(){ const l=prompt('New stage name (e.g. "Waterproofing"):'); if(!l||!l.trim()) return; state.stages.push({id:nextStageId(),label:l.trim()}); persist(); renderMain(); }
function renameStage(id){ const s=getStage(id); if(!s) return; const l=prompt('Rename stage:',s.label); if(!l||!l.trim()) return; s.label=l.trim(); persist(); renderMain(); }
function removeStage(id){ const n=state.items.filter(i=>i.stageId===id).length; if(n&&!confirm(`${n} task line(s) are in this stage — they'll become unassigned. Continue?`)) return; state.items.forEach(i=>{if(i.stageId===id)i.stageId=null;}); state.stages=state.stages.filter(s=>s.id!==id); schedCache=null; persist(); renderMain(); }

let showOrder=false;
function toggleSuggestedOrder(){ showOrder=!showOrder; const box=document.getElementById('orderBox'); if(!box) return; if(!showOrder){box.innerHTML='';return;}
  const order=suggestedOrder();
  box.innerHTML=`<div class="card" style="margin-bottom:16px;"><div class="sect" style="margin-top:0;">Suggested execution order</div>

    <ol class="orderlist">${order.map(it=>`<li><span class="dot" style="background:${tradeColor(tradeBucket(it.workerType||it.category).key)}"></span>${esc(it.room)} — ${esc(it.name)} ${tagLineType(it.lineType)}</li>`).join('')}</ol></div>`;
}

/* ============================== TAB: MATERIALS ============================== */
/* Every Material line becomes a procurement row. Needed-by = the parent task's scheduled start
   (materials must be on site before work begins). Track buy status here. */
function materialLines(){
  const {map}=computeSchedule();
  const tasks=groupByTask(state.items); const tByLineId={};
  tasks.forEach(t=>t.lines.forEach(l=>tByLineId[l.id]=t));
  return state.items.filter(i=>i.lineType==='Material').map(m=>{
    const t=tByLineId[m.id]; const s=t?map[t.taskId]:null;
    const rate=m.costMethod==='rate'?getRate(m.rateKey):null;
    return {line:m, task:t, needBy:s?s.start:null, qty:m.costMethod==='rate'?m.qty:null, unit:rate?rate.unit:'', cost:itemCost(m)};
  });
}
function renderMaterialsTab(){
  const q=state.searchQuery||'';
  let rows=materialLines();
  const filter=phaseFiltered(state.items).map(i=>i.id);
  rows=rows.filter(r=>filter.includes(r.line.id));
  if(q) rows=rows.filter(r=>[r.line.name,r.line.room,r.line.notes,(r.task&&r.task.category)].filter(Boolean).join(' ').toLowerCase().includes(q.toLowerCase()));
  rows.sort((a,b)=>{ if(!a.needBy&&!b.needBy) return 0; if(!a.needBy) return 1; if(!b.needBy) return -1; return a.needBy-b.needBy; });

  const total=rows.reduce((s,r)=>s+r.cost,0);
  const toBuy=rows.filter(r=>r.line.buyStatus==='To buy'); const toBuyCost=toBuy.reduce((s,r)=>s+r.cost,0);
  const ordered=rows.filter(r=>r.line.buyStatus==='Ordered').length;
  const delivered=rows.filter(r=>r.line.buyStatus==='Delivered').length;

  // group by week needed
  const groups={}; rows.forEach(r=>{ const key=r.needBy?isoWeekKey(r.needBy):'zzz'; (groups[key]=groups[key]||[]).push(r); });
  const keys=Object.keys(groups).sort();
  const body=keys.map(k=>{
    const label = k==='zzz'?'No scheduled date':('Buy for week of '+fmtDay(parseDate(k)));
    const rws=groups[k].map(r=>{
      const bs=r.line.buyStatus||'To buy';
      const badgeCol = bs==='Delivered'?'var(--ok)':bs==='Ordered'?'var(--brand)':'var(--action-2)';
      return `<tr>
        <td>${r.needBy?`<span class="num" style="color:${r.needBy<new Date()?'var(--danger)':'inherit'}">${fmtDay(r.needBy)}</span>`:'—'}</td>
        <td>${esc(r.line.name)}</td>
        <td style="color:var(--ink-soft);">${esc(r.line.room)}</td>
        <td class="num">${r.qty!=null?(r.qty+' '+esc(r.unit)):'—'}</td>
        <td class="num">${fmt(r.cost)}</td>
        <td><select style="color:${badgeCol};font-weight:600;" onchange="setBuyStatus('${r.line.id}',this.value)">${BUY_STATUSES.map(s=>`<option ${bs===s?'selected':''}>${s}</option>`).join('')}</select></td>
        <td><input type="text" value="${esc(r.line.notes||'')}" placeholder="vendor / note…" oninput="updateNotes('${r.line.id}',this.value)"></td>
      </tr>`;
    }).join('');
    return `<tr class="grp"><td colspan="7">${label} · ${fmt(groups[k].reduce((s,r)=>s+r.cost,0))}</td></tr>${rws}`;
  }).join('') || `<tr><td colspan="7"><div class="empty">No material lines yet. Add a task with a material cost and it shows up here.</div></td></tr>`;

  return `
    <h1 class="page-h">Materials</h1>
    <p class="page-sub">Everything you need to buy, ordered by when it's needed on site. "Buy for week of…" is set a task's start date — order a little earlier to be safe. Mark items ordered or delivered as you go.</p>
    ${phaseFilterChips()}
    <div class="statrow">
      <div class="stat"><div class="k">Material budget</div><div class="v">${fmt(total)}</div></div>
      <div class="stat"><div class="k">Still to buy</div><div class="v sm">${fmt(toBuyCost)}</div><div class="note">${toBuy.length} item${toBuy.length===1?'':'s'}</div></div>
      <div class="stat"><div class="k">Ordered</div><div class="v sm">${ordered}</div></div>
      <div class="stat"><div class="k">Delivered</div><div class="v sm">${delivered}</div></div>
    </div>
    <div class="row" style="margin-bottom:10px;justify-content:flex-end;">${searchBox('Search materials…')}</div>
    <table class="dt"><thead><tr><th>Need by</th><th>Material</th><th>Room</th><th>Qty</th><th style="text-align:right;">Est. cost</th><th>Status</th><th>Vendor / note</th></tr></thead><tbody>${body}</tbody></table>`;
}

/* ============================== TAB: ESTIMATE ============================== */
function groupSums(items,fn){ const m={}; items.forEach(i=>{const k=fn(i); m[k]=(m[k]||0)+itemCost(i);}); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function barRows(pairs,total,colorFn){
  const max=Math.max(1,...pairs.map(p=>p[1]));
  return pairs.map(([label,val])=>`<div class="bar-row"><div>${esc(label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,val/max*100)}%;background:${colorFn?colorFn(label):'var(--brand)'};"></div></div><div class="bar-val">${fmt(val)}</div></div>`).join('')||'<div class="empty">No items yet</div>';
}
function renderEstimateTab(){
  const q=state.searchQuery||'';

  const total=grandTotal(items), mand=grandTotal(items.filter(i=>i.mandatory)), opt=grandTotal(items.filter(i=>!i.mandatory));
  const matTotal=grandTotal(items.filter(i=>i.lineType==='Material'));
  const byRoom=groupSums(items,i=>i.room);

  function taskRow(task){
    const chev=task.isSplit?`<button class="iconbtn" onclick="toggleExpand('${task.taskId}')">${expandedTasks.has(task.taskId)?'▾':'▸'}</button>`:`<span style="display:inline-block;width:22px;"></span>`;

    return html;
  }
  let list=groupByTask(items); if(q) list=list.filter(t=>matchesSearch(t,q));

      <div class="stat"><div class="k">Optional</div><div class="v sm">${fmt(opt)}</div></div>

    </div>
    <div class="sect">Cost by room</div>${barRows(byRoom,total)}
    <div class="sect">Cost by trade</div>${barRows(byTrade,total,(l)=>tradeColor(tradeBucket(l).key))}

    <table class="dt"><thead><tr><th>Room</th><th>Task</th><th>Type</th><th>Trade</th><th style="text-align:right;">Cost</th></tr></thead><tbody>${taskRows}</tbody></table>`;

/* ============================== TAB: TRACK ============================== */
function renderTrackTab(){
  const q=state.searchQuery||'';
  const items=phaseFiltered(state.items);
  const done=items.filter(i=>i.status==='Done').length;
  const pct=items.length?Math.round(done/items.length*100):0;
  const est=grandTotal(items);
  const actual=items.reduce((s,i)=>s+(i.actualCost!=null?Number(i.actualCost):0),0);
  const ac=items.filter(i=>i.actualCost!=null).length;

  function taskRow(task){
    const chev=task.isSplit?`<button class="iconbtn" onclick="toggleExpand('${task.taskId}')">${expandedTasks.has(task.taskId)?'▾':'▸'}</button>`:`<span style="display:inline-block;width:22px;"></span>`;
    const tActual=task.lines.reduce((s,l)=>s+(l.actualCost!=null?Number(l.actualCost):0),0);
    const anyA=task.lines.some(l=>l.actualCost!=null);
    const sumStatus=task.lines.every(l=>l.status==='Done')?'Done':task.lines.some(l=>l.status==='In Progress')?'In Progress':task.lines.every(l=>l.status==='On Hold')?'On Hold':'Not Started';
    const actualCell=task.isSplit?`<span class="num">${anyA?fmt(tActual):'—'}</span>`:`<input type="number" placeholder="—" value="${task.lines[0].actualCost!=null?task.lines[0].actualCost:''}" style="width:96px;text-align:right;" oninput="updateActualCost('${task.lines[0].id}',this.value)">`;
    const statusCell=task.isSplit?`<span class="badge">${sumStatus}</span>`:`<select onchange="updateStatus('${task.lines[0].id}',this.value)">${STATUSES.map(s=>`<option ${task.lines[0].status===s?'selected':''}>${s}</option>`).join('')}</select>`;
    const notesCell=task.isSplit?`<span style="color:var(--ink-soft);font-size:12px;">expand to edit</span>`:`<input type="text" value="${esc(task.lines[0].notes||'')}" placeholder="Notes…" oninput="updateNotes('${task.lines[0].id}',this.value)">`;
    let html=`<tr><td>${esc(task.room)}</td><td>${chev}${esc(task.name)}${task.isSplit?' <span style="font-size:10px;color:var(--ink-faint);">(Mat+Lab)</span>':''}</td><td><span class="badge">${task.isSplit?'Multiple':esc(task.lines[0].workerType||'—')}</span></td><td class="num">${fmt(task.totalCost)}</td><td>${actualCell}</td><td>${statusCell}</td><td>${notesCell}</td></tr>`;
    if(task.isSplit&&expandedTasks.has(task.taskId)) html+=task.lines.map(l=>`<tr style="background:var(--surface-2);"><td></td><td style="padding-left:30px;font-size:12px;">${tagLineType(l.lineType)}</td><td><span class="badge">${esc(l.workerType||'—')}</span></td><td class="num" style="font-size:12px;">${fmt(itemCost(l))}</td><td><input type="number" placeholder="—" value="${l.actualCost!=null?l.actualCost:''}" style="width:96px;text-align:right;" oninput="updateActualCost('${l.id}',this.value)"></td><td><select onchange="updateStatus('${l.id}',this.value)">${STATUSES.map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="text" value="${esc(l.notes||'')}" placeholder="Notes…" oninput="updateNotes('${l.id}',this.value)"></td></tr>`).join('');
    return html;
  }
  let list=groupByTask(items); if(q) list=list.filter(t=>matchesSearch(t,q));
  const rows=list.map(taskRow).join('')||`<tr><td colspan="7"><div class="empty">No tasks match.</div></td></tr>`;

  return `
    <h1 class="page-h">Track</h1>
    <p class="page-sub">As work happens on site, log status and what you actually spent against the estimate. Split tasks show a combined figure — expand to log material and labour separately.</p>
    ${phaseFilterChips()}
    <div class="statrow">
      <div class="stat"><div class="k">Progress</div><div class="v">${pct}%</div><div class="note">${done} / ${items.length} lines done</div></div>
      <div class="stat"><div class="k">Estimated</div><div class="v sm">${fmt(est)}</div></div>
      <div class="stat"><div class="k">Actual so far</div><div class="v sm">${fmt(actual)}</div><div class="note">${ac} logged</div></div>
      <div class="stat"><div class="k">Variance</div><div class="v sm" style="color:${actual>est&&ac>0?'var(--danger)':'var(--ok)'};">${ac?fmt(actual-est):'—'}</div></div>
    </div>
    <div class="row" style="margin-bottom:10px;justify-content:flex-end;">${searchBox('Search tasks…')}</div>
    <table class="dt"><thead><tr><th>Room</th><th>Task</th><th>Trade</th><th style="text-align:right;">Est.</th><th>Actual ₹</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function updateActualCost(id,val){ const it=getItem(id); if(!it) return; it.actualCost=val===''?null:Number(val); persist();
  const items=state.items; const actual=items.reduce((s,i)=>s+(i.actualCost!=null?Number(i.actualCost):0),0); const est=grandTotal(items);
  const cards=document.querySelectorAll('#main .stat .v'); if(cards[2])cards[2].textContent=fmt(actual); if(cards[3])cards[3].textContent=items.some(i=>i.actualCost!=null)?fmt(actual-est):'—';
}
function updateStatus(id,val){ const it=getItem(id); if(!it) return; it.status=val; persist(); renderMain(); }
function updateNotes(id,val){ const it=getItem(id); if(!it) return; it.notes=val; persist(); }

function openTaskModal(taskId, presetPhase, presetStage){
  draftIsNew=!taskId;
  if(!taskId){
    draftTask={ taskId:uid('task'), room:state.rooms[0]||'', name:'', category:'Carpentry',
      phase: presetPhase!=null?presetPhase:(state.phases[0]?state.phases[0].id:1),
      stageId: presetStage!=null?presetStage:null, mandatory:true, isSplit:false,
      durationDays: CATEGORY_DURATION['Carpentry']||2, startOverride:null,
      single:blankLine('Inclusive', tradeFor('Carpentry','Inclusive')),
      material:blankLine('Material','Material'),
      labor:blankLine('Labor', tradeFor('Carpentry','Labor')) };
  } else {
    const members=state.items.filter(i=>i.taskId===taskId);
    const mat=members.find(m=>m.lineType==='Material'); const lab=members.find(m=>m.lineType==='Labor');
    const isSplit=members.length===2&&!!mat&&!!lab; const primary=members[0]||{};
    draftTask={ taskId, room:primary.room||state.rooms[0]||'', name:primary.name||'', category:primary.category||'Carpentry',
      phase: primary.phase!=null?primary.phase:(state.phases[0]?state.phases[0].id:1),
      stageId: primary.stageId!=null?primary.stageId:null, mandatory:primary.mandatory!==false, isSplit,
      durationDays: primary.durationDays!=null?primary.durationDays:(CATEGORY_DURATION[primary.category]||2),
      startOverride: primary.startOverride||null,
      single:(!isSplit&&members[0])?cloneLine(members[0]):blankLine('Inclusive','Carpenter'),
      material:mat?cloneLine(mat):blankLine('Material','Material'),
      labor:lab?cloneLine(lab):blankLine('Labor', tradeFor(primary.category||'Carpentry','Labor')) };
  }
  document.addEventListener('keydown', handleModalKeydown, true);
  renderModal();
}
function handleStageSelect(val){
  if(val==='__new__'){ const label=prompt('New stage name:');
    if(label&&label.trim()){ const stage={id:nextStageId(),label:label.trim()}; state.stages.push(stage); draftTask.stageId=stage.id; persist(); }
  } else { draftTask.stageId= val===''?null:Number(val); }
  renderModal();
}
function handlePhaseSelectInModal(val){ draftTask.phase=Number(val); renderModal(); }
function closeModal(){ draftTask=null; document.removeEventListener('keydown', handleModalKeydown, true); document.getElementById('modalRoot').innerHTML=''; }

function lineFieldsHTML(prefix, line, showDeps){
  const rateOptions=state.rates.map(r=>`<option value="${r.key}" ${line.rateKey===r.key?'selected':''}>${esc(r.label)} (₹${r.value}/${esc(r.unit)})</option>`).join('');
  const otherItems=state.items.filter(i=>i.taskId!==draftTask.taskId);
  const depBoxes=otherItems.length?otherItems.map(d=>`
    <label class="dep"><input type="checkbox" value="${d.id}" ${(line.dependsOn||[]).includes(d.id)?'checked':''} onchange="toggleDep('${prefix}','${d.id}',this.checked)"> ${esc(d.room)} — ${esc(d.name)} <span class="muted">(${d.lineType})</span></label>`).join('')
    :'<div class="muted sm">No other items yet.</div>';
  const isMat=line.lineType==='Material';
  return `
    <div class="frow">
      <div class="fld"><label>Worker / Trade</label>
        <input type="text" value="${esc(line.workerType)}" placeholder="e.g. Painter, Mason" oninput="draftTask.${prefix}.workerType=this.value"></div>
      <div class="fld"><label>Status</label>
        <select onchange="draftTask.${prefix}.status=this.value">${STATUSES.map(s=>`<option ${line.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="fld"><label>Costing method</label>
      <div class="radios">
        <label><input type="radio" name="cm_${prefix}" ${line.costMethod==='rate'?'checked':''} onchange="draftTask.${prefix}.costMethod='rate';renderModal();"> Rate card × quantity</label>
        <label><input type="radio" name="cm_${prefix}" ${line.costMethod==='custom'?'checked':''} onchange="draftTask.${prefix}.costMethod='custom';renderModal();"> Flat / quoted amount</label>
      </div></div>
    ${line.costMethod==='rate'?`
    <div class="frow">
      <div class="fld"><label>Rate</label><select onchange="draftTask.${prefix}.rateKey=this.value;updatePreview();">${rateOptions}</select></div>
      <div class="fld"><label>Quantity</label><input type="number" value="${line.qty}" oninput="draftTask.${prefix}.qty=Number(this.value);updatePreview();"></div>
    </div>`:`
    <div class="fld"><label>Amount (₹)</label><input type="number" value="${line.customAmount}" oninput="draftTask.${prefix}.customAmount=Number(this.value);updatePreview();"></div>`}
    ${isMat?`<div class="fld"><label>Procurement status</label>
      <select onchange="draftTask.${prefix}.buyStatus=this.value">${BUY_STATUSES.map(b=>`<option ${line.buyStatus===b?'selected':''}>${b}</option>`).join('')}</select></div>`:''}
    ${showDeps?`<div class="fld"><label>Depends on (must finish first)</label><div class="deplist">${depBoxes}</div></div>`:''}
    <div class="frow">
      <div class="fld"><label>Actual cost (₹, optional)</label>
        <input type="number" value="${line.actualCost!=null?line.actualCost:''}" oninput="draftTask.${prefix}.actualCost=this.value===''?null:Number(this.value)"></div>
      <div class="fld"><label>Notes</label><input type="text" value="${esc(line.notes||'')}" oninput="draftTask.${prefix}.notes=this.value"></div>
    </div>`;
}

function renderModal(){
  const root=document.getElementById('modalRoot');
  if(!draftTask){ root.innerHTML=''; return; }
  const t=draftTask;
  const roomOptions=state.rooms.map(r=>`<option ${t.room===r?'selected':''}>${esc(r)}</option>`).join('');
  const catOptions=CATEGORIES.map(c=>`<option ${t.category===c?'selected':''}>${esc(c)}</option>`).join('');
  const phaseOptions=state.phases.map(p=>`<option value="${p.id}" ${t.phase===p.id?'selected':''}>${esc(p.label)}</option>`).join('');
  const cost=t.isSplit?(itemCost(t.material)+itemCost(t.labor)):itemCost(t.single);
  const dot=`<span class="tdot" style="background:${tradeColor(tradeBucket(tradeFor(t.category, t.isSplit?'Labor':t.single.lineType)))}"></span>`;

  root.innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><h2>${dot}${draftIsNew?'Add task':'Edit task'}</h2>
        <button class="iconbtn" onclick="closeModal()" title="Close">✕</button></div>
      <div class="modal-body">
        <div class="frow">
          <div class="fld"><label>Room / Area</label><select onchange="draftTask.room=this.value">${roomOptions}</select></div>
          <div class="fld"><label>Category</label><select onchange="handleCategoryChange(this.value)">${catOptions}</select></div>
        </div>
        <div class="fld"><label>Task name</label>
          <input type="text" id="itemNameInput" value="${esc(t.name)}" placeholder="e.g. Re-tile bathroom wall" oninput="draftTask.name=this.value"></div>
        <div class="fld"><label>Structure</label>
          <div class="radios">
            <label><input type="radio" name="split" ${!t.isSplit?'checked':''} onchange="setStructure(false)"> Single line</label>
            <label><input type="radio" name="split" ${t.isSplit?'checked':''} onchange="setStructure(true)"> Material + Labour (together)</label>
          </div></div>
        <div class="frow">
          <div class="fld"><label>Stage (execution order)</label>
            <select onchange="handleStageSelect(this.value)">
              <option value="" ${t.stageId==null?'selected':''}>— No stage —</option>
              ${state.stages.map(s=>`<option value="${s.id}" ${t.stageId===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}
              <option value="__new__">+ New stage…</option>
            </select></div>
          <div class="fld"><label>Phase</label><select onchange="handlePhaseSelectInModal(this.value)">${phaseOptions}</select></div>
          <div class="fld"><label>Flag</label>
            <select onchange="draftTask.mandatory=(this.value==='m')">
              <option value="m" ${t.mandatory?'selected':''}>Mandatory</option>
              <option value="o" ${!t.mandatory?'selected':''}>Optional</option>
            </select></div>
        </div>
        <div class="frow">
          <div class="fld"><label>Duration (working days)</label>
            <input type="number" min="1" value="${t.durationDays||1}" oninput="draftTask.durationDays=Math.max(1,Number(this.value)||1)"></div>
          <div class="fld"><label>Fixed start date (optional)</label>
            <input type="date" value="${t.startOverride||''}" oninput="draftTask.startOverride=this.value||null">
            <div class="muted sm">Leave blank to auto-schedule from stage &amp; dependencies.</div></div>
        </div>
        ${t.isSplit?`
          <div class="sec-title">${tagLineType('Material')}</div>
          ${lineFieldsHTML('material',t.material,false)}
          <div class="sec-title">${tagLineType('Labor')}</div>
          ${lineFieldsHTML('labor',t.labor,true)}
        `:`
          <div class="fld"><label>Line type</label>
            <div class="radios">${LINE_TYPES.map(lt=>`<label><input type="radio" name="lt" value="${lt}" ${t.single.lineType===lt?'checked':''} onchange="setSingleLineType('${lt}')"> ${lt}</label>`).join('')}</div></div>
          ${lineFieldsHTML('single',t.single,true)}
        `}
      </div>
      <div class="modal-footer">
        <div>Cost: <span class="preview-cost" id="previewCost">${fmt(cost)}</span></div>
        <div class="row">
          ${!draftIsNew?`<button class="btn-danger" onclick="deleteTask('${t.taskId}');closeModal();">Delete</button>`:''}
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveDraftTask()">Save</button>
        </div>
      </div>
    </div>
  </div>`;
  const nameEl=document.getElementById('itemNameInput');
  if(nameEl&&draftIsNew&&!t.name){ nameEl.focus(); }
}
function handleModalKeydown(ev){
  if(!draftTask) return;
  if(ev.key==='Escape'){ ev.preventDefault(); closeModal(); return; }
  if(ev.key==='Enter'){ const tag=(ev.target&&ev.target.tagName||'').toLowerCase();
    if(tag==='textarea') return; ev.preventDefault(); saveDraftTask(); }
}
function setStructure(isSplit){ draftTask.isSplit=isSplit; applyCategoryTrades(); renderModal(); }
function setSingleLineType(lt){ draftTask.single.lineType=lt; draftTask.single.workerType=tradeFor(draftTask.category,lt); renderModal(); }
function handleCategoryChange(cat){ draftTask.category=cat; draftTask.durationDays=CATEGORY_DURATION[cat]||draftTask.durationDays||2; applyCategoryTrades(); renderModal(); }
function applyCategoryTrades(){ const t=draftTask;
  if(t.isSplit){ t.material.workerType='Material'; t.labor.workerType=tradeFor(t.category,'Labor'); }
  else { t.single.workerType=tradeFor(t.category,t.single.lineType); } }
function updatePreview(){ const el=document.getElementById('previewCost'); if(!el) return; const t=draftTask;
  el.textContent=fmt(t.isSplit?(itemCost(t.material)+itemCost(t.labor)):itemCost(t.single)); }
function toggleDep(which, depId, checked){ const line=draftTask[which]; const cur=new Set(line.dependsOn||[]);
  if(checked)cur.add(depId); else cur.delete(depId); line.dependsOn=[...cur]; }

function saveDraftTask(){
  const t=draftTask;
  if(!t.name||!t.name.trim()){ alert('Give the task a name first.'); return; }
  const shared={ room:t.room, name:t.name.trim(), category:t.category, phase:t.phase, stageId:t.stageId,
    mandatory:t.mandatory, taskId:t.taskId, durationDays:Math.max(1,Number(t.durationDays)||1), startOverride:t.startOverride||null };
  let newLines;
  if(t.isSplit){
    const matId=t.material.id||uid('item'); const labId=t.labor.id||uid('item');
    newLines=[ Object.assign({},shared,t.material,{id:matId,lineType:'Material'}),
      Object.assign({},shared,t.labor,{id:labId,lineType:'Labor'}) ];
  } else {
    const sId=t.single.id||uid('item');
    newLines=[ Object.assign({},shared,t.single,{id:sId}) ];
  }
  const oldMemberIds=state.items.filter(i=>i.taskId===t.taskId).map(i=>i.id);
  const newIds=new Set(newLines.map(l=>l.id));
  const droppedIds=oldMemberIds.filter(id=>!newIds.has(id));
  const others=state.items.filter(i=>i.taskId!==t.taskId).map(i=>droppedIds.length?Object.assign({},i,{dependsOn:(i.dependsOn||[]).filter(d=>!droppedIds.includes(d))}):i);
  const prospective=[...others,...newLines];
  for(const line of newLines){
    if(line.dependsOn&&line.dependsOn.length&&wouldCreateCycle(line.id,line.dependsOn,prospective)){
      alert(`The "${line.lineType}" line has a circular dependency — please review before saving.`); return; }
  }
  state.items=prospective; persist(); closeModal(); renderAll();
}
function deleteTask(taskId){
  const members=state.items.filter(i=>i.taskId===taskId);
  if(!members.length) return;
  const label=members[0].room+' — '+members[0].name;
  if(!confirm(`Delete "${label}"${members.length>1?' (both Material and Labour lines)':''}? This also removes it from any dependency lists.`)) return;
  const ids=members.map(m=>m.id);
  state.items=state.items.filter(i=>i.taskId!==taskId);
  state.items.forEach(i=>{ i.dependsOn=(i.dependsOn||[]).filter(d=>!ids.includes(d)); });
  persist(); renderAll();
}

/* ============================== TEMPLATE PICKER ============================== */
function openTemplatePicker(presetStage){
  const root=document.getElementById('modalRoot');
  const tpls=TEMPLATES();
  const cards=tpls.map((tp,i)=>{
    const trade=tradeFor(tp.category, tp.split?'Labor':(tp.single||'Inclusive'));
    const col=tradeColor(tradeBucket(trade));
    const struct=tp.split?'Material + Labour':(tp.flat?'Flat amount':'Rate × qty');
    return `<button class="tpl-card" onclick="pickTemplate(${i}, ${presetStage!=null?presetStage:'null'})">
      <span class="tdot" style="background:${col}"></span>
      <span class="tpl-name">${esc(tp.name)}</span>
      <span class="tpl-meta">${esc(tp.category)} · ${struct}</span></button>`;
  }).join('');
  root.innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-sm">
      <div class="modal-head"><h2>Start from a template</h2>
        <button class="iconbtn" onclick="closeModal()" title="Close">✕</button></div>
      <div class="modal-body">
        <p class="muted sm" style="margin:0 0 12px;">Pick a common job to prefill category, trade, structure and a starting rate. You can adjust everything before saving.</p>
        <div class="tpl-grid">${cards}</div>
      </div>
      <div class="modal-footer">
        <div class="muted sm">or</div>
        <button class="btn-ghost" onclick="closeModal();openTaskModal(null${presetStage!=null?','+'null,'+presetStage:''})">Start blank instead</button>
      </div>
    </div>
  </div>`;
}
function pickTemplate(i, presetStage){
  const tp=TEMPLATES()[i];
  openTaskModal(null, null, presetStage!=null?presetStage:null);
  const t=draftTask;
  t.name=tp.name; t.category=tp.category;
  t.durationDays=CATEGORY_DURATION[tp.category]||2;
  if(tp.split){
    t.isSplit=true;
    t.material=blankLine('Material','Material');
    t.labor=blankLine('Labor', tradeFor(tp.category,'Labor'));
    if(tp.mat){ t.material.costMethod='rate'; t.material.rateKey=tp.mat; }
    if(tp.lab){ t.labor.costMethod='rate'; t.labor.rateKey=tp.lab; }
  } else {
    t.isSplit=false;
    t.single=blankLine(tp.single||'Inclusive', tradeFor(tp.category, tp.single||'Inclusive'));
    if(tp.rate){ t.single.costMethod='rate'; t.single.rateKey=tp.rate; }
    else if(tp.flat){ t.single.costMethod='custom'; }
  }
  renderModal();
}
