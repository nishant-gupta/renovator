/* rooms */
function renameRoom(idx, val){
  const t=(val||'').trim(); if(!t) return;
  const old=state.rooms[idx]; if(t===old) return;
  if(state.rooms.includes(t)){ alert('That room already exists.'); renderMain(); return; }
  state.rooms[idx]=t;
  state.items.forEach(i=>{ if(i.room===old) i.room=t; });
  if(state.planRoomFilter===old) state.planRoomFilter=t;
  persist(); renderMain();
}
function removeRoom(idx){
  const room=state.rooms[idx]; const inUse=state.items.filter(i=>i.room===room).length;
  if(inUse){ alert(`"${room}" is used by ${inUse} task(s). Move or delete those first.`); return; }
  if(!confirm(`Remove "${room}"?`)) return;
  state.rooms.splice(idx,1);
  if(state.planRoomFilter===room) state.planRoomFilter='All';
  persist(); renderMain();
}
/* rates */
function updateRate(key, value){ const r=getRate(key); if(!r) return; r.value=Number(value)||0; schedCache=null; persist();
  const items=phaseFiltered(state.items); /* live-patch estimate not needed on setup */ }
function addRate(){
  const label=prompt('New rate name (e.g. "Waterproofing — sqft"):'); if(!label) return;
  const unit=prompt('Unit (sqft / running ft / point / fixture / lumpsum):','sqft')||'sqft';
  const value=Number(prompt('₹ per unit:','0'))||0;
  state.rates.push({key:uid('rate'),label,unit,value}); persist(); renderMain();
}
function deleteRate(key){
  const inUse=state.items.some(i=>i.costMethod==='rate'&&i.rateKey===key);
  if(inUse&&!confirm('Some tasks use this rate — deleting it will zero their cost until you fix them. Continue?')) return;
  state.rates=state.rates.filter(r=>r.key!==key); persist(); renderMain();
}
/* phases */
function addPhase(){ const label=prompt('New phase name (e.g. "Phase 4" or "Someday"):'); if(!label||!label.trim()) return;
  state.phases.push({id:nextPhaseId(),label:label.trim()}); persist(); renderMain(); }
function renamePhaseInline(id, val){ const ph=getPhase(id); if(!ph) return; const t=(val||'').trim(); if(!t){ renderMain(); return; } ph.label=t; persist(); renderMain(); }
function removePhase(id){
  if(state.phases.length<=1){ alert('You need at least one phase.'); return; }
  const inUse=state.items.filter(i=>i.phase===id).length; const fallback=state.phases.find(p=>p.id!==id);
  if(inUse&&!confirm(`${inUse} task(s) use this phase — they'll move to "${fallback.label}". Continue?`)) return;
  state.items.forEach(i=>{ if(i.phase===id) i.phase=fallback.id; });
  state.phases=state.phases.filter(p=>p.id!==id);
  if(state.phaseFilter===id) state.phaseFilter='All';
  persist(); renderMain();
}
function movePhase(idx, dir){ const j=idx+dir; if(j<0||j>=state.phases.length) return;
  const a=state.phases; [a[idx],a[j]]=[a[j],a[idx]]; persist(); renderMain(); }
/* stages */
function renameStageInline(id, val){ const s=getStage(id); if(!s) return; const t=(val||'').trim(); if(!t){ renderMain(); return; } s.label=t; persist(); renderMain(); }
function moveStage(idx, dir){ const j=idx+dir; if(j<0||j>=state.stages.length) return;
  const a=state.stages; [a[idx],a[j]]=[a[j],a[idx]]; schedCache=null; persist(); renderMain(); }

/* ============================== EXCEL EXPORT ============================== */
function exportXLSX(){
  const items=state.items;
  const wb=XLSX.utils.book_new();
  const depTag=x=>x.room+' - '+x.name+' ['+x.lineType+']';
  const {map}=computeSchedule();
  const taskByLineId={}; groupByTask(items).forEach(t=>t.lines.forEach(l=>taskByLineId[l.id]=t));
  const startFor=it=>{ const t=taskByLineId[it.id]; const s=t?map[t.taskId]:null; return s?isoDate(s.start):''; };
  const endFor=it=>{ const t=taskByLineId[it.id]; const s=t?map[t.taskId]:null; return s?isoDate(s.end):''; };

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    [{Setting:'Project start', Value:state.projectStart||''},
     {Setting:'Work weekends', Value:state.workWeekends?'Yes':'No'},
     {Setting:'Cascade stages', Value:state.sequenceStages?'Yes':'No'}]), 'Project');

  const rateSheet=state.rates.map(r=>({Rate:r.label, Unit:r.unit, 'Rate (INR)':r.value}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rateSheet), 'Rate Card');

  // master lists so empty phases/stages survive a round-trip, keeping their order
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    state.phases.map((p,i)=>({Order:i+1, Phase:p.label}))), 'Phases');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    state.stages.map((s,i)=>({Order:i+1, Stage:s.label}))), 'Stages');

  const itemSheet=items.map(it=>({
    Room:it.room, Item:it.name, Category:it.category, 'Line Type':it.lineType,
    'Worker/Trade':it.workerType, 'Mandatory/Optional':it.mandatory?'Mandatory':'Optional',
    'Costing Method':it.costMethod==='rate'?'Rate x Qty':'Flat Amount',
    'Rate Used':it.costMethod==='rate'?((getRate(it.rateKey)||{}).label||''):'',
    Quantity:it.costMethod==='rate'?it.qty:'',
    'Est. Cost (INR)':itemCost(it),
    Stage:(getStage(it.stageId)||{}).label||'',
    Phase:(getPhase(it.phase)||{}).label||'',
    'Duration (days)':it.durationDays!=null?it.durationDays:'',
    'Fixed Start':it.startOverride||'',
    'Buy Status':it.lineType==='Material'?(it.buyStatus||'To buy'):'',
    'Depends On':(it.dependsOn||[]).map(d=>{const x=getItem(d);return x?depTag(x):'';}).filter(Boolean).join('; '),
    Status:it.status, 'Actual Cost (INR)':it.actualCost!=null?it.actualCost:'', Notes:it.notes||'',
    'Task ID':it.taskId||it.id,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemSheet), 'Rooms & Items');

  const schedSheet=[...items].sort((a,b)=>{
      const sa=taskByLineId[a.id], sb=taskByLineId[b.id];
      const da=sa?map[sa.taskId].start:0, db=sb?map[sb.taskId].start:0;
      return da-db || stageOrder(a.stageId)-stageOrder(b.stageId);
    }).map(it=>({
      Start:startFor(it), End:endFor(it),
      Stage:(getStage(it.stageId)||{}).label||'', Phase:(getPhase(it.phase)||{}).label||'',
      Room:it.room, Item:it.name, 'Line Type':it.lineType, Trade:it.workerType,
      'Duration (days)':it.durationDays!=null?it.durationDays:'',
      'Depends On':(it.dependsOn||[]).map(d=>{const x=getItem(d);return x?depTag(x):'';}).filter(Boolean).join('; ')
    }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(schedSheet), 'Schedule');

  const matSheet=materialLines()
    .sort((a,b)=>{ if(!a.needBy&&!b.needBy)return 0; if(!a.needBy)return 1; if(!b.needBy)return -1; return a.needBy-b.needBy; })
    .map(r=>({ 'Need By':r.needBy?isoDate(r.needBy):'', Material:r.line.name, Room:r.line.room,
      Quantity:r.qty!=null?r.qty:'', Unit:r.unit||'', 'Est. Cost (INR)':r.cost,
      'Buy Status':r.line.buyStatus||'To buy', 'Vendor / Note':r.line.notes||'' }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matSheet.length?matSheet:[{'Need By':'',Material:'(no material lines)'}]), 'Materials');

  const order=suggestedOrder().map((it,idx)=>({Step:idx+1, Room:it.room, Item:it.name, 'Line Type':it.lineType}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(order), 'Suggested Order');

  const byRoom=groupSums(items,i=>i.room);
  const byTrade=groupSums(items,i=>i.workerType||'—');
  const byPhase=groupSums(items,i=>(getPhase(i.phase)||{}).label||'Unassigned');
  const summarySheet=[
    {Section:'GRAND TOTAL', Key:'', 'Amount (INR)':grandTotal(items)},
    {Section:'Mandatory vs Optional', Key:'Mandatory', 'Amount (INR)':grandTotal(items.filter(i=>i.mandatory))},
    {Section:'', Key:'Optional', 'Amount (INR)':grandTotal(items.filter(i=>!i.mandatory))},
    {Section:'', Key:'Materials', 'Amount (INR)':grandTotal(items.filter(i=>i.lineType==='Material'))},
    ...byRoom.map(([k,v])=>({Section:'By Room', Key:k, 'Amount (INR)':v})),
    ...byTrade.map(([k,v])=>({Section:'By Trade', Key:k, 'Amount (INR)':v})),
    ...byPhase.map(([k,v])=>({Section:'By Phase', Key:k, 'Amount (INR)':v})),
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summarySheet), 'Estimate Summary');

  const trackSheet=items.map(it=>({ Room:it.room, Item:it.name, Trade:it.workerType, 'Est. Cost (INR)':itemCost(it),
    'Actual Cost (INR)':it.actualCost!=null?it.actualCost:'', Status:it.status, Notes:it.notes||'' }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trackSheet), 'Track');

  XLSX.writeFile(wb, 'Home_Renovation_Plan.xlsx');
}

/* ============================== EXCEL IMPORT (backward compatible) ============================== */
function handleImportFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); importFromWorkbook(wb); }
    catch(err){ alert('Could not read that as an Excel workbook. Use a .xlsx exported from this planner (or edited from one).\n\n'+err.message); } };
  reader.onerror=()=>alert('Could not read that file.');
  reader.readAsArrayBuffer(file);
}
function stripStageNum(s){ return String(s||'').replace(/^\s*\d+\s*[·.\-]\s*/,'').trim(); }
function importFromWorkbook(wb){
  const itemsSheetName=wb.SheetNames.find(n=>n==='Rooms & Items')||wb.SheetNames[0];
  const rateSheetName=wb.SheetNames.find(n=>n==='Rate Card');
  if(!wb.Sheets[itemsSheetName]){ alert('No "Rooms & Items" sheet found — nothing to import.'); return; }
  const itemRows=XLSX.utils.sheet_to_json(wb.Sheets[itemsSheetName],{defval:''});
  if(!itemRows.length){ alert('That sheet has no rows to import.'); return; }
  if(!confirm(`Import ${itemRows.length} item(s)? This REPLACES everything currently in the planner. Export first if you want to keep the current plan.`)) return;

  const headers=Object.keys(itemRows[0]);
  const hasStageCol=headers.includes('Stage');
  const hasBatchCol=headers.includes('Trade Batch');
  const isOld=!hasStageCol; // old exports had no clean Stage column

  // rates
  const newRates=[]; const rateKeyByLabel={};
  if(rateSheetName&&wb.Sheets[rateSheetName]){
    XLSX.utils.sheet_to_json(wb.Sheets[rateSheetName],{defval:''}).forEach(r=>{
      const label=String(r['Rate']||'').trim(); if(!label) return;
      const key=uid('rate'); newRates.push({key,label,unit:String(r['Unit']||'sqft').trim(),value:Number(r['Rate (INR)'])||0}); rateKeyByLabel[label]=key;
    });
  }
  if(!newRates.length) newRates.push(...defaultRates());

  // stage label per row (new: Stage col; old: Trade Batch, else stripped Phase)
  const rowStage=row=> hasStageCol ? String(row['Stage']||'').trim()
    : (hasBatchCol && String(row['Trade Batch']||'').trim()) ? String(row['Trade Batch']||'').trim()
    : stripStageNum(row['Phase']);

  // build stage list in schedule order if available
  const schedName=wb.SheetNames.find(n=>n==='Schedule');
  const orderSource=(schedName&&wb.Sheets[schedName])?XLSX.utils.sheet_to_json(wb.Sheets[schedName],{defval:''}):itemRows;
  const newStages=[]; const stageIdByLabel={};
  // prefer an explicit Stages master sheet (keeps order + empty stages)
  const stagesSheet=wb.SheetNames.find(n=>n==='Stages');
  if(stagesSheet&&wb.Sheets[stagesSheet]){
    XLSX.utils.sheet_to_json(wb.Sheets[stagesSheet],{defval:''}).forEach(r=>{ const label=String(r['Stage']||'').trim();
      if(!label||stageIdByLabel[label]!=null) return; const id=newStages.length+1; newStages.push({id,label}); stageIdByLabel[label]=id; });
  }
  orderSource.forEach(row=>{ const label=rowStage(row); if(!label||stageIdByLabel[label]!=null) return;
    const id=newStages.length+1; newStages.push({id,label}); stageIdByLabel[label]=id; });

  // phases: prefer explicit Phases master sheet; else new files derive from item labels; old files reset to defaults by mandatory
  const newPhases=[]; const phaseIdByLabel={};
  const phasesSheet=wb.SheetNames.find(n=>n==='Phases');
  if(phasesSheet&&wb.Sheets[phasesSheet]){
    XLSX.utils.sheet_to_json(wb.Sheets[phasesSheet],{defval:''}).forEach(r=>{ const label=String(r['Phase']||'').trim();
      if(!label||phaseIdByLabel[label]!=null) return; const id=newPhases.length+1; newPhases.push({id,label}); phaseIdByLabel[label]=id; });
  } else if(!isOld){
    orderSource.forEach(row=>{ const label=String(row['Phase']||'').trim(); if(!label||phaseIdByLabel[label]!=null) return;
      const id=newPhases.length+1; newPhases.push({id,label}); phaseIdByLabel[label]=id; });
  }
  if(!newPhases.length) newPhases.push(...defaultPhases());
  const phase1=newPhases[0].id, phaseLast=newPhases[newPhases.length-1].id;

  const newRooms=[]; const newItems=[]; const lookupByTag={};
  itemRows.forEach(row=>{
    const room=String(row['Room']||'').trim()||'Unassigned'; if(!newRooms.includes(room)) newRooms.push(room);
    const name=String(row['Item']||'').trim()||'Untitled item';
    const lineType=LINE_TYPES.includes(row['Line Type'])?row['Line Type']:'Inclusive';
    const isRate=String(row['Costing Method']||'').toLowerCase().indexOf('rate')===0;
    const estCost=Number(row['Est. Cost (INR)'])||0;
    const rateKey=isRate?(rateKeyByLabel[String(row['Rate Used']||'').trim()]||''):'';
    const category=String(row['Category']||'Other').trim()||'Other';
    const mandatory=String(row['Mandatory/Optional']||'Mandatory').trim().toLowerCase()!=='optional';
    let itemPhase;
    if(isOld){ itemPhase=mandatory?phase1:phaseLast; }
    else { const pl=String(row['Phase']||'').trim(); itemPhase=phaseIdByLabel[pl]!=null?phaseIdByLabel[pl]:phase1; }
    const stageLabel=rowStage(row);
    const statusVal=STATUSES.includes(row['Status'])?row['Status']:'Not Started';
    const actualRaw=row['Actual Cost (INR)'];
    const durRaw=row['Duration (days)']!==undefined?row['Duration (days)']:row['Duration Days'];
    const buyRaw=String(row['Buy Status']||'').trim();
    const item={
      id:uid('item'), taskId:String(row['Task ID']||'').trim()||null, room, name, category, lineType,
      workerType:String(row['Worker/Trade']||'').trim(),
      mandatory, phase:itemPhase,
      stageId:(stageLabel&&stageIdByLabel[stageLabel]!=null)?stageIdByLabel[stageLabel]:null,
      dependsOn:[],
      costMethod:(isRate&&rateKey)?'rate':'custom',
      rateKey:(isRate&&rateKey)?rateKey:(newRates[0]?newRates[0].key:''),
      qty:isRate?(Number(row['Quantity'])||0):0,
      customAmount:(isRate&&rateKey)?0:estCost,
      durationDays:(durRaw!==''&&durRaw!=null&&!isNaN(Number(durRaw)))?Number(durRaw):(CATEGORY_DURATION[category]||1),
      startOverride:String(row['Fixed Start']||'').trim()||null,
      buyStatus:BUY_STATUSES.includes(buyRaw)?buyRaw:'To buy',
      status:statusVal, actualCost:(actualRaw===''||actualRaw==null)?null:Number(actualRaw), notes:String(row['Notes']||'').trim(),
    };
    newItems.push(item);
    lookupByTag[room+' - '+name+' ['+lineType+']']=item.id;
    item._depText=String(row['Depends On']||'');
  });
  newItems.forEach(item=>{ const text=item._depText||''; delete item._depText; if(!text.trim()) return;
    text.split(';').map(s=>s.trim()).filter(Boolean).forEach(tag=>{ if(lookupByTag[tag]) item.dependsOn.push(lookupByTag[tag]); }); });
  deriveTaskIds(newItems);
  if(!newStages.length) newStages.push(...defaultStages());

  // project settings sheet (new files)
  let projectStart=defaultProjectStart(), workWeekends=false, sequenceStages=true;
  const projName=wb.SheetNames.find(n=>n==='Project');
  if(projName&&wb.Sheets[projName]){
    XLSX.utils.sheet_to_json(wb.Sheets[projName],{defval:''}).forEach(r=>{
      const k=String(r['Setting']||'').toLowerCase(), v=String(r['Value']||'').trim();
      if(k.includes('start')&&/^\d{4}-\d\d-\d\d$/.test(v)) projectStart=v;
      if(k.includes('weekend')) workWeekends=/^y/i.test(v);
      if(k.includes('cascade')) sequenceStages=/^y/i.test(v);
    });
  }

  state={ rates:newRates, rooms:newRooms.length?newRooms:defaultRooms(), phases:newPhases, stages:newStages, items:newItems,
    projectStart, workWeekends, sequenceStages, scheduleView:'timeline',
    activeTab:'tasks', planRoomFilter:'All', phaseFilter:'All', searchQuery:'' };
  schedCache=null; persist(); renderAll();
  alert(`Imported ${newItems.length} item(s) across ${newRooms.length} room(s)${isOld?' (older file — phases reset to Now/Next by mandatory flag, stages read from your trade batches)':''}.`);
}

/* ============================== INIT ============================== */
loadState();

</script>
